# ÖNİZLEME yayını — ihtida.ulucamii.be (GitHub Pages, özel alan adı: public/CNAME).
# ulucamii-site/.github/workflows/deploy.yml örnek alınmıştır. Henüz ÇALIŞTIRILMADI:
# depo/uzak (remote) yok, DNS kaydı yok. Yayın yalnız Rıdvan'ın açık kararıyla,
# dernek hesabı (GitHub: ulucamii2026) üzerinden açılır.
name: Önizlemeyi yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `npm run build` = astro check + astro build → eksik çeviri anahtarı yayını durdurur.
      - name: Astro ile derle ve yükle
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          node-version: 24
          package-manager: npm@latest
      - name: Önizleme kilidi denetimi (noindex + bant her sayfada)
        run: |
          eksik=0
          for f in $(find dist -name '*.html'); do
            grep -q 'name="robots" content="noindex,nofollow"' "$f" || { echo "noindex yok: $f"; eksik=1; }
            grep -q 'data-onizleme-bandi' "$f" || { echo "önizleme bandı yok: $f"; eksik=1; }
          done
          exit $eksik

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
